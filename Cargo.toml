[package]
name = "markdown2html-converter"
version = "2.1.1"
authors = ["Magic Len <len@magiclen.org>"]
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/magiclen/markdown2html-converter"
homepage = "https://magiclen.org/markdown2html-converter"
keywords = ["markdown", "html", "MathJax", "LaTeX", "highlight"]
categories = ["command-line-utilities"]
description = "A tool for converting a Markdown file to a single HTML file with built-in CSS and JS."
license = "MIT"
include = ["src/**/*", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "resources/*"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
clap = { version = "4", features = ["derive"] }
concat-with = "0.2"
terminal_size = "0.4"

anyhow = "1"
same-file = "1"

html-minifier = "6"
comrak = { version = "0.56", default-features = false }
html-escape = "0.3"
base64 = "0.23"
yaml-rust2 = { version = "0.13", default-features = false }
